name: "Bug Report"
description: "Report a reproducible software bug or unexpected error in Content Engine Pro."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please search existing issues first.
        
        **CRITICAL CONFIDENTIALITY WARNING**:
        Do **NOT** include license keys, API keys, passwords, customer emails, or private URLs. All logs must be redacted.

  - type: dropdown
    id: edition
    attributes:
      label: "Affected Edition"
      description: "Which edition are you currently running?"
      options:
        - "Commercial Pro Edition (Active License)"
        - "Free Plan (No License / 6 articles per month)"
        - "Pro Edition (Grace Period)"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "Content Engine Pro Version"
      placeholder: "e.g., 2.0.0"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: "Environment Details"
      description: "WordPress version, PHP version, Web server."
      placeholder: "WordPress 6.7, PHP 8.2, Nginx, Shared Hosting / VPS"
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: "Active AI Provider(s)"
      description: "Which provider was active when the issue occurred?"
      placeholder: "e.g., Google Gemini, Groq Cloud, OpenRouter, Mistral, Ollama"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: "Problem Description"
      description: "A clear and concise description of the bug."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the issue."
      placeholder: |
        1. Go to 'Content Engine' -> '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected vs. Actual Behavior"
      description: "What did you expect to happen, and what actually occurred?"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Redacted Log Entries"
      description: "Paste relevant sanitized entries from Content Engine -> Operation Logs. Ensure NO API keys or credentials are included."
      render: shell
    validations:
      required: false

